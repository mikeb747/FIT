<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="FIT Track - Strava Activities Explorer & Performance Analytics" />
    <meta property="og:title" content="FIT Track" />
    <meta property="og:description" content="FIT Track - Strava Activities Explorer & Performance Analytics" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json?v=1.2.2" />
    <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png?v=1.2.2" />
    <link rel="icon" type="image/png" sizes="512x512" href="./android-chrome-512x512.png?v=1.2.2" />
    <link rel="shortcut icon" href="./android-chrome-192x192.png?v=1.2.2" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1.2.2" />
  </head>
  <body>
    <script>
      // 1. Seamless forward from legacy /IronFIT/ to /GymFIT/ preserving OAuth query params (?code=...) and hash
      if (window.location.pathname.toLowerCase().startsWith('/ironfit')) {
        var queryAndHash = window.location.search + window.location.hash;
        var targetPath = window.location.pathname.replace(/^\/ironfit/i, '/GymFIT');
        if (!targetPath.endsWith('/')) targetPath += '/';
        window.location.replace(window.location.origin + targetPath + queryAndHash);
      }

      // 2. Normalizes GitHub Pages path to include trailing slash (/GymFIT/) so PWA manifest scope is isolated
      var repoMatch = window.location.pathname.match(/^\/(GymFIT)$/i);
      if (window.location.hostname.endsWith('github.io') && repoMatch) {
        window.location.replace('/' + repoMatch[1] + '/' + window.location.search + window.location.hash);
      }
    </script>
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,sans-serif;">
        <img src="./android-chrome-512x512.png?v=1.2.2" alt="FIT Track" style="width:144px;height:144px;object-fit:contain;" />
        <h1 style="margin-top:16px;font-size:18px;font-weight:800;color:#090a0f;letter-spacing:0.04em;text-transform:uppercase;">FIT Track</h1>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
