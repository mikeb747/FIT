name: Deploy GymFIT to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production SPA
        run: |
          npm run build
          touch dist/.nojekyll
          test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: './dist'

      - name: Wait for GitHub Artifact Index Propagation
        run: sleep 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Artifact Indexing
        run: sleep 3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
